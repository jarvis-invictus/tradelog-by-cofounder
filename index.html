<style>
:root {
  --anchor: #121F29;
  --anchor-80: rgba(18,31,41,0.8);
  --sage: #A7C5B0;
  --lavender: #C9B4F2;
  --lavender-20: rgba(201,180,242,0.2);
  --lavender-10: rgba(201,180,242,0.1);
  --sand: #FFD9A6;
  --mint: #E6F5EE;
  --paper: #FBFBF9;
  --neutral: #F3F5F4;
  --ink-muted: #5A6B73;
  --rule: #E3E6E4;
  --success: #6FA77E;
  --danger: #D95F5F;
  --white: #ffffff;
  --mono: 'JetBrains Mono', monospace;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

body {
  font-family: 'Inter', sans-serif;
  background: var(--paper);
  color: var(--anchor);
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ── NOISE TEXTURE OVERLAY ── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 9999;
  opacity: 0.4;
}

/* ── CURSOR ── */
.cursor {
  width: 8px; height: 8px;
  background: var(--lavender);
  border-radius: 50%;
  position: fixed;
  top: 0; left: 0;
  pointer-events: none;
  z-index: 10000;
  transition: transform 0.1s;
  mix-blend-mode: multiply;
}
.cursor-ring {
  width: 32px; height: 32px;
  border: 1.5px solid var(--lavender);
  border-radius: 50%;
  position: fixed;
  top: 0; left: 0;
  pointer-events: none;
  z-index: 10000;
  transition: width 0.3s, height 0.3s, border-color 0.3s;
}

/* ── NAV ── */
nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 1000;
  padding: 0 48px;
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  transition: background 0.4s, border-bottom 0.4s, backdrop-filter 0.4s;
}
nav.scrolled {
  background: rgba(251,251,249,0.88);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--rule);
}
.nav-logo {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  color: var(--anchor);
}
.nav-logo svg { width: 28px; height: 28px; }
.nav-logo-text {
  font-size: 17px;
  font-weight: 700;
  letter-spacing: -0.3px;
}
.nav-links {
  display: flex;
  align-items: center;
  gap: 36px;
  list-style: none;
}
.nav-links a {
  font-size: 14px;
  font-weight: 500;
  color: var(--ink-muted);
  text-decoration: none;
  transition: color 0.2s;
  position: relative;
}
.nav-links a::after {
  content: '';
  position: absolute;
  bottom: -2px; left: 0;
  width: 0; height: 1px;
  background: var(--lavender);
  transition: width 0.3s;
}
.nav-links a:hover { color: var(--anchor); }
.nav-links a:hover::after { width: 100%; }
.nav-cta {
  background: var(--anchor);
  color: var(--paper);
  padding: 9px 20px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  text-decoration: none;
  transition: background 0.2s, transform 0.2s, box-shadow 0.2s;
}
.nav-cta:hover {
  background: #1e3040;
  transform: translateY(-1px);
  box-shadow: 0 4px 16px rgba(18,31,41,0.2);
}

/* ── HERO ── */
.hero {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 120px 48px 80px;
  position: relative;
  overflow: hidden;
}
.hero-bg-grid {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(var(--rule) 1px, transparent 1px),
    linear-gradient(90deg, var(--rule) 1px, transparent 1px);
  background-size: 48px 48px;
  opacity: 0.5;
  mask-image: radial-gradient(ellipse 80% 60% at 50% 50%, black 40%, transparent 100%);
}
.hero-glow {
  position: absolute;
  width: 800px; height: 800px;
  background: radial-gradient(circle, rgba(201,180,242,0.18) 0%, transparent 70%);
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  pointer-events: none;
}
.hero-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--lavender-10);
  border: 1px solid rgba(201,180,242,0.4);
  border-radius: 100px;
  padding: 6px 16px;
  font-size: 12px;
  font-weight: 600;
  color: #8B6FD4;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  margin-bottom: 28px;
  opacity: 0;
}
.hero-badge-dot {
  width: 6px; height: 6px;
  background: var(--lavender);
  border-radius: 50%;
  animation: pulse-dot 2s ease-in-out infinite;
}
@keyframes pulse-dot {
  0%,100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(0.7); }
}
.hero-headline {
  font-size: clamp(48px, 7vw, 88px);
  font-weight: 900;
  line-height: 1.0;
  letter-spacing: -3px;
  text-align: center;
  max-width: 900px;
  margin-bottom: 24px;
  opacity: 0;
}
.hero-headline em {
  font-style: normal;
  background: linear-gradient(135deg, var(--lavender) 0%, #9B7FE8 50%, var(--sage) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.hero-sub {
  font-size: 18px;
  color: var(--ink-muted);
  text-align: center;
  max-width: 560px;
  line-height: 1.65;
  margin-bottom: 40px;
  font-weight: 400;
  opacity: 0;
}
.hero-ctas {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 48px;
  opacity: 0;
}
.btn-primary {
  background: var(--anchor);
  color: var(--paper);
  padding: 14px 28px;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 600;
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: all 0.25s;
  position: relative;
  overflow: hidden;
}
.btn-primary::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(201,180,242,0.15), transparent);
  opacity: 0;
  transition: opacity 0.3s;
}
.btn-primary:hover::before { opacity: 1; }
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(18,31,41,0.25); }
.btn-secondary {
  background: transparent;
  color: var(--anchor);
  padding: 14px 28px;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 600;
  text-decoration: none;
  border: 1.5px solid var(--rule);
  transition: all 0.25s;
}
.btn-secondary:hover { border-color: var(--anchor); transform: translateY(-2px); }

.hero-social-proof {
  display: flex;
  align-items: center;
  gap: 16px;
  opacity: 0;
  margin-bottom: 64px;
}
.hero-avatars { display: flex; }
.hero-avatar {
  width: 32px; height: 32px;
  border-radius: 50%;
  border: 2px solid var(--paper);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  color: white;
  margin-left: -10px;
}
.hero-avatar:first-child { margin-left: 0; }
.hero-social-text { font-size: 13px; color: var(--ink-muted); }
.hero-social-text strong { color: var(--anchor); }
.hero-stars { color: #F59E0B; font-size: 13px; letter-spacing: 1px; }

/* ── APP PREVIEW ── */
.hero-app-preview {
  width: 100%;
  max-width: 900px;
  background: var(--anchor);
  border-radius: 20px;
  overflow: hidden;
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.1),
    0 32px 80px rgba(18,31,41,0.4),
    0 0 120px rgba(201,180,242,0.1);
  opacity: 0;
  transform: translateY(40px);
  position: relative;
}
.app-titlebar {
  background: rgba(255,255,255,0.05);
  border-bottom: 1px solid rgba(255,255,255,0.08);
  padding: 12px 20px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.titlebar-dot { width: 10px; height: 10px; border-radius: 50%; }
.app-body {
  display: grid;
  grid-template-columns: 200px 1fr;
  min-height: 380px;
}
.app-sidebar {
  border-right: 1px solid rgba(255,255,255,0.06);
  padding: 20px 0;
}
.sidebar-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 20px;
  font-size: 13px;
  color: rgba(255,255,255,0.4);
  cursor: pointer;
  transition: all 0.2s;
}
.sidebar-item.active {
  background: rgba(201,180,242,0.1);
  color: var(--lavender);
  border-right: 2px solid var(--lavender);
}
.sidebar-item svg { width: 15px; height: 15px; }
.app-main { padding: 24px; }
.app-stats-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 20px;
}
.app-stat {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 10px;
  padding: 14px;
}
.app-stat-label { font-size: 10px; color: rgba(255,255,255,0.35); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 6px; font-family: var(--mono); }
.app-stat-value { font-size: 20px; font-weight: 700; color: white; font-family: var(--mono); }
.app-stat-value.up { color: var(--sage); }
.app-stat-value.lav { color: var(--lavender); }
.app-stat-value.sand { color: var(--sand); }
.app-table { width: 100%; border-collapse: collapse; }
.app-table th {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: rgba(255,255,255,0.25);
  text-align: left;
  padding: 8px 10px;
  font-family: var(--mono);
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
.app-table td {
  font-size: 12px;
  font-family: var(--mono);
  color: rgba(255,255,255,0.7);
  padding: 10px;
  border-bottom: 1px solid rgba(255,255,255,0.04);
}
.trade-badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 10px;
  font-weight: 600;
}
.badge-win { background: rgba(111,167,126,0.15); color: var(--sage); }
.badge-loss { background: rgba(217,95,95,0.15); color: #E88; }
.badge-open { background: rgba(255,217,166,0.15); color: var(--sand); }
.pnl-up { color: var(--sage); }
.pnl-down { color: #E88; }

/* ── SECTION BASE ── */
section { padding: 96px 48px; }
.section-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--ink-muted);
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.section-label::before {
  content: '';
  width: 24px; height: 1px;
  background: var(--lavender);
}
.section-heading {
  font-size: clamp(32px, 4vw, 52px);
  font-weight: 800;
  letter-spacing: -1.5px;
  line-height: 1.1;
  margin-bottom: 20px;
}
.section-sub {
  font-size: 16px;
  color: var(--ink-muted);
  line-height: 1.65;
  max-width: 520px;
}
.text-center { text-align: center; }
.text-center .section-label { justify-content: center; }
.text-center .section-label::before { display: none; }
.text-center .section-sub { margin: 0 auto; }

/* ── PROBLEM ── */
.problem { background: var(--anchor); color: white; }
.problem .section-label { color: rgba(255,255,255,0.4); }
.problem .section-label::before { background: var(--lavender); }
.problem .section-heading { color: white; }
.problem .section-sub { color: rgba(255,255,255,0.5); }
.problem-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 2px;
  margin-top: 64px;
  border-radius: 16px;
  overflow: hidden;
}
.problem-card {
  background: rgba(255,255,255,0.04);
  padding: 40px 36px;
  position: relative;
  overflow: hidden;
  transition: background 0.3s;
}
.problem-card:hover { background: rgba(255,255,255,0.07); }
.problem-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
}
.problem-card:nth-child(1)::before { background: var(--danger); }
.problem-card:nth-child(2)::before { background: var(--sand); }
.problem-card:nth-child(3)::before { background: var(--lavender); }
.problem-icon {
  width: 48px; height: 48px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 20px;
}
.problem-icon svg { width: 24px; height: 24px; }
.problem-card-tag {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 12px;
}
.problem-card h3 {
  font-size: 20px;
  font-weight: 700;
  color: white;
  margin-bottom: 10px;
  letter-spacing: -0.3px;
}
.problem-card p {
  font-size: 14px;
  color: rgba(255,255,255,0.45);
  line-height: 1.65;
}
.problem-bg-glow {
  position: absolute;
  width: 400px; height: 400px;
  border-radius: 50%;
  filter: blur(100px);
  pointer-events: none;
  opacity: 0.15;
}

/* ── HOW IT WORKS ── */
.hiw { background: var(--paper); }
.hiw-steps { margin-top: 72px; display: flex; flex-direction: column; gap: 2px; }
.hiw-step {
  display: grid;
  grid-template-columns: 80px 1fr 1fr;
  gap: 0;
  align-items: stretch;
  background: white;
  border: 1px solid var(--rule);
  border-radius: 16px;
  overflow: hidden;
  transition: box-shadow 0.3s, border-color 0.3s;
  opacity: 0;
  transform: translateY(30px);
}
.hiw-step:hover {
  box-shadow: 0 8px 40px rgba(18,31,41,0.08);
  border-color: var(--lavender);
}
.hiw-step-num {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 36px;
  font-weight: 900;
  color: var(--rule);
  font-family: var(--mono);
  border-right: 1px solid var(--rule);
  padding: 40px 0;
  letter-spacing: -2px;
  transition: color 0.3s;
}
.hiw-step:hover .hiw-step-num { color: var(--lavender); }
.hiw-step-content { padding: 40px 48px; }
.hiw-step-tag {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--lavender);
  margin-bottom: 10px;
}
.hiw-step-content h3 {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.5px;
  margin-bottom: 10px;
}
.hiw-step-content p {
  font-size: 14px;
  color: var(--ink-muted);
  line-height: 1.65;
  max-width: 380px;
}
.hiw-step-visual {
  border-left: 1px solid var(--rule);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 32px;
  background: var(--neutral);
  min-height: 180px;
  position: relative;
  overflow: hidden;
}

/* Step visuals */
.visual-rules {
  display: flex;
  flex-direction: column;
  gap: 8px;
  width: 100%;
}
.rule-item {
  display: flex;
  align-items: center;
  gap: 10px;
  background: white;
  border: 1px solid var(--rule);
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 12px;
  font-weight: 500;
  color: var(--anchor);
  transition: all 0.3s;
}
.rule-item svg { width: 14px; height: 14px; color: var(--lavender); flex-shrink: 0; }
.rule-item.active {
  border-color: var(--lavender);
  background: var(--lavender-10);
}

.visual-sync {
  display: flex;
  align-items: center;
  gap: 12px;
}
.sync-platform {
  background: white;
  border: 1px solid var(--rule);
  border-radius: 10px;
  padding: 14px 18px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 600;
  color: var(--anchor);
}
.sync-platform svg { width: 20px; height: 20px; }
.sync-arrow { color: var(--lavender); font-size: 20px; }
.sync-db {
  background: var(--anchor);
  border-radius: 10px;
  padding: 14px 18px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 600;
  color: white;
}
.sync-db svg { width: 20px; height: 20px; color: var(--lavender); }

.visual-metrics {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  width: 100%;
}
.metric-chip {
  background: white;
  border: 1px solid var(--rule);
  border-radius: 8px;
  padding: 12px;
  text-align: center;
}
.metric-chip-val {
  font-size: 18px;
  font-weight: 800;
  font-family: var(--mono);
  letter-spacing: -1px;
}
.metric-chip-lbl {
  font-size: 10px;
  color: var(--ink-muted);
  text-transform: uppercase;
  letter-spacing: 0.8px;
  font-family: var(--mono);
  margin-top: 2px;
}

.visual-coach {
  background: white;
  border: 1px solid var(--lavender);
  border-radius: 12px;
  padding: 16px 20px;
  width: 100%;
}
.coach-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
  font-size: 11px;
  font-weight: 700;
  color: #8B6FD4;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.coach-header svg { width: 14px; height: 14px; }
.coach-text {
  font-size: 13px;
  color: var(--anchor);
  line-height: 1.55;
}
.coach-cursor {
  display: inline-block;
  width: 2px; height: 14px;
  background: var(--lavender);
  margin-left: 2px;
  vertical-align: middle;
  animation: blink 1s step-end infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

/* ── FEATURES ── */
.features { background: var(--neutral); }
.features-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin-top: 64px;
}
.feature-card {
  background: white;
  border: 1px solid var(--rule);
  border-radius: 16px;
  padding: 32px;
  position: relative;
  overflow: hidden;
  transition: all 0.3s;
  opacity: 0;
  transform: translateY(20px);
}
.feature-card::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 16px;
  border: 1.5px solid var(--lavender);
  opacity: 0;
  transition: opacity 0.3s;
}
.feature-card:hover { transform: translateY(-4px); box-shadow: 0 12px 40px rgba(18,31,41,0.08); }
.feature-card:hover::after { opacity: 1; }
